name: Build macOS (arm64 DMG)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/zh-ui-polish
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon (.dmg)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      # Exclude orphaned gitlinks in .repos/ and large mobile static libraries.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+ & Node.js
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache Rust resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v4
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust toolchain
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check i18n translations
        run: pnpm i18n:check

      - name: Build unsigned macOS arm64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          T3CODE_DESKTOP_SIGNED: "false"
        run: pnpm dist:desktop:dmg:arm64

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: t3code-macos-arm64-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true
