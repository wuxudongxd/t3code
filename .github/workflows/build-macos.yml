name: Build macOS (arm64 DMG)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/zh-ui-polish
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon (.dmg)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # Exclude orphaned gitlinks in .repos/ and large mobile static libraries.
      # Using git directly avoids actions/checkout's post-job credential cleanup
      # running `git submodule foreach` against orphaned gitlinks in .repos/.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/' '!/apps/mobile/modules/t3-terminal/Vendor/**/*.a'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Cache Rust resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v4
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust toolchain
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Ensure Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! xcodebuild -version | grep -qE '^Xcode 26\.'; then
            xcode26="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [[ -n "$xcode26" ]]; then
              sudo xcode-select -s "$xcode26/Contents/Developer"
            fi
          fi
          xcodebuild -version
          xcrun swiftc --version

      - name: Check i18n translations
        run: vp run i18n:check

      - name: Build unsigned macOS arm64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          T3CODE_DESKTOP_SIGNED: "false"
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: vp run dist:desktop:dmg:arm64

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: t3code-macos-arm64-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true
